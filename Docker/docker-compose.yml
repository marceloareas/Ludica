services:
  db:
    image: postgres:latest
    container_name: meu_postgres
    restart: always
    environment:
      - POSTGRES_USER=usuario_admin
      - POSTGRES_PASSWORD=Ludicaproject123
      - POSTGRES_DB=Ludica_desenv
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Esta linha roda os scripts do banco de dados.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_admin -d Ludica_desenv"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rede-aplicacao

  backend:
    build: ../back-end
    container_name: ludica_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=usuario_admin
      - DB_PASSWORD=Ludicaproject123
      - DB_NAME=Ludica_desenv
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-aplicacao

  frontend:
    build: ../front-end
    container_name: ludica_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - rede-aplicacao

volumes:
  pgdata:

networks:
  rede-aplicacao:
    driver: bridge
